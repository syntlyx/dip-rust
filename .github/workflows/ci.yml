name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

  lint-templates:
    name: Lint template scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: shellcheck
        run: |
          find src/templates -type f -exec awk 'FNR==1 && /^#!/{print FILENAME}' {} + \
            | xargs shellcheck --severity=style --exclude=SC1091

      # shellcheck can't flag `dip exec app "cmd $*"` — quoted "$*" is legal
      # shell, but for a passthrough wrapper it joins argv into one string
      # that a container shell re-parses (breaking (), quotes, *). Wrappers
      # must pass arguments as separate argv: `dip exec app cmd "$@"`.
      - name: forbid argv-joining exec wrappers
        run: |
          bad=$(grep -rnE 'dip exec.*\$\*|dip exec[^"]*"[^"]+ \$\{?@' src/templates || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo '::error::pass args to dip exec as separate argv ("$@"), not joined into one string'
            exit 1
          fi
