server {
    listen 80;
    root /var/www/html/web;
    index index.php index.html;

    client_max_body_size 64M;

    # Disable autoindex
    autoindex off;

    # Block Drupal core installer and update scripts
    location ~ ^/core/(install|update)\.php$ {
        deny all;
        return 403;
    }

    # Protect Drupal files and directories
    location ~ \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml|svn-base)$ {
        deny all;
        return 403;
    }

    # Protect configuration and system files
    location ~ /(code-style\.pl|Entries.*|Repository|Root|Tag|Template|all-wcprops|entries|format|composer\.(json|lock)|\.htaccess|yarn\.lock|package\.json)$ {
        deny all;
        return 403;
    }

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    # Robots
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Block .txt and .log files
    location ~* \.(txt|log)$ {
        deny all;
    }

    # Block PHP files in unusual locations
    location ~ \..*/.*\.php$ {
        return 403;
    }

    # Protect private directories
    location ~ ^/sites/.*/private/ {
        return 403;
    }

    # Block PHP in files directory
    location ~ ^/sites/[^/]+/files/.*\.php$ {
        deny all;
    }

    # Block hidden files and directories
    location ~ (^|/)\. {
        return 403;
    }

    # Block PHP in vendor directory
    location ~ /vendor/.*\.php$ {
        deny all;
        return 404;
    }

    # CSS/JS/styles generation through Drupal
    location ~ ^/sites/.*/files/(css|js|styles)/ {
        try_files $uri @rewrite;
    }

    # Private files through Drupal
    location ~ ^(/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    # Main rule for clean URLs
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Rewrite for legacy URLs
    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    # Cache static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri @rewrite;
        expires max;
        log_not_found off;
        access_log off;
    }

    # Remove index.php from URLs
    if ($request_uri ~* "^(.*/)index\.php(.*)") {
        return 301 $1$2;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
}
