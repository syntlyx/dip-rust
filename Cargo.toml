[package]
name = "dip"
version = "0.1.8"
edition = "2024"

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "3.0"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = "0.0.6"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = { version = "0.16", default-features = false }
time = { version = "0.3", features = ["std"] }

# Proxy server
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
chrono = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1.9"

# DB migration
sqlx = { version = "0.9", default-features = false, features = ["mysql", "postgres", "runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "json"] }
rust_decimal = "1"
futures = "0.3"

# SSH tunnel (dip share)
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2"] }

# Template embedding
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
