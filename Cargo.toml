[package]
name = "dip"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = "0.0.7"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = { version = "0.18", default-features = false }
time = { version = "0.3", features = ["std", "formatting", "macros"] }

# Proxy server
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1.9"

# DB migration
sqlx = { version = "0.9", default-features = false, features = ["mysql", "postgres", "runtime-tokio", "tls-rustls", "time", "rust_decimal", "json"] }
rust_decimal = "1"
futures = "0.3"

# Template embedding
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
